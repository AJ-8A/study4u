<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study4U Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#071115;--paper:#eef3f0;--muted:#93a39f;--line:rgba(255,255,255,.22);--glass:rgba(231,239,235,.13)}
*{box-sizing:border-box}html{background:#071115}body{margin:0;min-height:100vh;color:var(--paper);font-family:Inter,sans-serif;background:linear-gradient(180deg,rgba(5,12,15,.48),rgba(4,11,14,.74)),url("https://images.unsplash.com/photo-1584335204568-b440757daca1?auto=format&fit=crop&fm=jpg&q=95&w=2200") center/cover fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 52% 8%,rgba(255,255,255,.18),transparent 28%);z-index:-1}
main{width:min(1160px,92%);margin:auto;padding:44px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font:1.6rem "DM Serif Display",serif;letter-spacing:-.03em}.brand span:first-child{color:#f0f5f2}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(235,242,239,.10);backdrop-filter:blur(14px);font-size:.72rem;color:#d8e3df}
.card{position:relative;overflow:hidden;padding:34px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(224,233,229,.18),rgba(7,16,20,.36));box-shadow:0 35px 100px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.09);backdrop-filter:blur(22px)}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 8s ease-in-out infinite}
h1{font:clamp(2.8rem,6vw,5.2rem)/.92 "DM Serif Display",serif;letter-spacing:-.045em;margin:0 0 12px}.muted{color:var(--muted)}.login{display:flex;gap:10px;margin-top:26px;position:relative;z-index:1}.login input{flex:1;background:rgba(4,12,15,.44);color:#f1f6f3;border:1px solid var(--line);padding:14px 16px;border-radius:13px;outline:0;backdrop-filter:blur(12px)}.login input:focus{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 4px rgba(255,255,255,.07)}
button{border:1px solid rgba(255,255,255,.25);border-radius:13px;padding:14px 20px;background:#eef3f0;color:#112329;font-weight:800;cursor:pointer;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.15)}button:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:28px 0}.stat{padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(235,242,239,.10);backdrop-filter:blur(14px)}.stat small{display:block;color:#9eafaa;text-transform:uppercase;font-size:.68rem;letter-spacing:.12em;margin-bottom:7px}.stat strong{font:2rem "DM Serif Display",serif}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:rgba(4,12,15,.24);backdrop-filter:blur(12px)}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.10)}th{color:#a8b6b2;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em}tr:hover td{background:rgba(255,255,255,.04)}
#message{min-height:24px}.error{color:#ff9b9b!important}.success{color:#b8e4cd!important}
@keyframes sweep{0%,45%{transform:translateX(-100%)}65%,100%{transform:translateX(100%)}}@media(max-width:650px){main{padding-top:24px}.top{align-items:flex-start;flex-direction:column;gap:12px}.login{flex-direction:column}.stats{grid-template-columns:1fr}.card{padding:22px}h1{font-size:3rem}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<div class="top"><div class="brand">Study<span>4U</span> <span style="color:var(--muted);font-weight:600">/ Admin</span></div><div class="badge">🔒 Private dashboard</div></div>
<div class="card">
<p style="letter-spacing:.18em;text-transform:uppercase;font-size:.68rem;color:#aab9b5;margin-bottom:12px">STUDY4U / PRIVATE</p><h1>Study4U Analytics</h1><p class="muted">A private command room for the people learning, returning, and building.</p>
<form id="login" class="login"><input id="token" type="password" placeholder="Enter admin token" autocomplete="current-password" required><button>Open dashboard</button></form>
<p id="message" class="muted"></p><div id="stats" class="stats"></div>
<div class="table-wrap"><table><thead><tr><th>Username</th><th>Viewed at</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></main>
<script>
const WORKER_URL="https://study4u-api.study4u-aj.workers.dev";
const form=document.getElementById("login"),tokenInput=document.getElementById("token"),message=document.getElementById("message"),rows=document.getElementById("rows"),stats=document.getElementById("stats");
form.addEventListener("submit",async e=>{e.preventDefault();const token=tokenInput.value.trim();if(!token)return;message.textContent="Connecting…";message.className="muted";
try{const r=await fetch(WORKER_URL+"/api/admin/visitors",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");
stats.innerHTML='<div class="stat"><small>Total views</small><strong>'+data.totalViews+'</strong></div><div class="stat"><small>Logged visitors</small><strong>'+data.visitors.length+'</strong></div>';
rows.innerHTML=data.visitors.map(v=>'<tr><td>'+escapeHtml(v.username||"Guest")+'</td><td>'+escapeHtml(v.viewed_at)+'</td></tr>').join("");message.textContent="Dashboard loaded successfully";message.className="success";
}catch(err){rows.innerHTML="";stats.innerHTML="";message.textContent=err.message;message.className="error"}});
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script></body></html>
