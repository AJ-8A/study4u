<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study4U Admin</title>
<style>
:root{--bg:#070b14;--panel:#101725;--panel2:#151e2e;--text:#edf2ff;--muted:#94a0b8;--border:#202a3d;--primary:#7c83ff;--good:#5ee6a8;--danger:#ff7585}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 85% 0,rgba(124,131,255,.18),transparent 32%),radial-gradient(circle at 10% 100%,rgba(94,230,168,.07),transparent 28%),var(--bg);color:var(--text)}
main{width:min(1100px,92%);margin:0 auto;padding:48px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{font-weight:800;font-size:1.35rem}.brand span{color:var(--primary)}.badge{padding:7px 11px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:.75rem}
.card{background:rgba(16,23,37,.9);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.35);backdrop-filter:blur(14px)}
h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem);letter-spacing:-1px}.muted{color:var(--muted)}.login{display:flex;gap:10px;margin-top:24px}.login input{flex:1;min-width:0;background:#0b1220;color:var(--text);caret-color:var(--primary);color-scheme:dark;border:1px solid var(--border);padding:13px 15px;border-radius:12px;outline:none}.login input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,131,255,.12)}
button{border:0;border-radius:12px;padding:13px 18px;background:var(--primary);color:#080b15;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1);transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:25px 0}.stat{padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--panel2)}.stat small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}.stat strong{font-size:1.8rem}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.7px;background:#0c1321}tr:last-child td{border-bottom:0}tr:hover td{background:rgba(124,131,255,.045)}
#message{min-height:24px}.error{color:var(--danger)!important}.success{color:var(--good)!important}
@media(max-width:650px){main{padding-top:25px}.top{align-items:flex-start;flex-direction:column}.login{flex-direction:column}.stats{grid-template-columns:1fr}.card{padding:20px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes glow{0%,100%{box-shadow:0 25px 70px rgba(0,0,0,.35)}50%{box-shadow:0 25px 80px rgba(124,131,255,.12)}}.top,.card{animation:fadeUp .65s ease both}.card{animation:fadeUp .65s ease both,glow 4s ease-in-out infinite}.stat{animation:fadeUp .45s ease both}.login button{transition:.2s ease}.login button:hover{box-shadow:0 8px 25px rgba(124,131,255,.3)}input{color-scheme:dark!important} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@keyframes cosmic{to{transform:rotate(360deg)}}@keyframes scan{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}body:before{content:"";position:fixed;inset:-40%;z-index:-1;pointer-events:none;background:conic-gradient(from 0deg,rgba(124,131,255,.18),transparent 25%,rgba(0,229,255,.09),transparent 50%,rgba(192,132,252,.12),transparent 75%);filter:blur(70px);animation:cosmic 20s linear infinite}.card{position:relative;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(124,131,255,.08),transparent);transform:translateX(-150%);animation:scan 5s ease-in-out infinite;pointer-events:none}.stat{transition:.3s;animation:rise .6s ease both}.stat:hover{transform:translateY(-7px) scale(1.02);border-color:rgba(124,131,255,.55);box-shadow:0 15px 35px rgba(0,0,0,.35),0 0 25px rgba(124,131,255,.12)}.table-wrap{box-shadow:0 0 30px rgba(124,131,255,.05)}tr{transition:.2s}button{transition:.25s;box-shadow:0 8px 25px rgba(124,131,255,.2)}button:hover{box-shadow:0 12px 35px rgba(124,131,255,.4)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head>
<body><main>
<div class="top"><div class="brand">Study<span>4U</span> <span style="color:var(--muted);font-weight:600">/ Admin</span></div><div class="badge">🔒 Private dashboard</div></div>
<div class="card">
<h1>Admin Analytics</h1><p class="muted">Secure visitor analytics for Study4U.</p>
<form id="login" class="login"><input id="token" type="password" placeholder="Enter admin token" autocomplete="current-password" required><button>Open dashboard</button></form>
<p id="message" class="muted"></p><div id="stats" class="stats"></div>
<div class="table-wrap"><table><thead><tr><th>Username</th><th>Viewed at</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></main>
<script>
const WORKER_URL="https://study4u-api.study4u-aj.workers.dev";
const form=document.getElementById("login"),tokenInput=document.getElementById("token"),message=document.getElementById("message"),rows=document.getElementById("rows"),stats=document.getElementById("stats");
form.addEventListener("submit",async e=>{e.preventDefault();const token=tokenInput.value.trim();if(!token)return;message.textContent="Connecting…";message.className="muted";
try{const r=await fetch(WORKER_URL+"/api/admin/visitors",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");
stats.innerHTML='<div class="stat"><small>Total views</small><strong>'+data.totalViews+'</strong></div><div class="stat"><small>Logged visitors</small><strong>'+data.visitors.length+'</strong></div>';
rows.innerHTML=data.visitors.map(v=>'<tr><td>'+escapeHtml(v.username||"Guest")+'</td><td>'+escapeHtml(v.viewed_at)+'</td></tr>').join("");message.textContent="Dashboard loaded successfully";message.className="success";
}catch(err){rows.innerHTML="";stats.innerHTML="";message.textContent=err.message;message.className="error"}});
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script></body></html>
